name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: SQL benchmark smoke test
        run: python scripts/benchmark.py --rows 10000 --repetitions 2 --output benchmarks/ci-smoke.json
      - name: Real server process test
        run: python scripts/api_loadtest.py --pairs 100 --clients 8 --workers 4 --output benchmarks/ci-api.json
