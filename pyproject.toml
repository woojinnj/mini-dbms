[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jungle-mini-dbms"
version = "1.0.0"
description = "An educational SQL engine, B+ tree index and bounded thread-pool API server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
minidb = "minidb.__main__:main"

[tool.setuptools.packages.find]
include = ["minidb*"]

[tool.setuptools.package-data]
minidb = ["web/*.html", "web/*.css", "web/*.js"]
